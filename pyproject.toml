[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-editor"
version = "0.1.0"
description = "LLM agent that performs line-by-line text edits using regex tools"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
